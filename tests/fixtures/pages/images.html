<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Images</title></head>
<body>
<main>
  <h1>Images</h1>
  <img id="team" src="red.png" alt="Our team at the office" width="40" height="30">
  <img class="logo" src="blue.png" width="20" height="20">
  <img class="spacer" src="blue.png" alt="" width="20" height="20">
  <svg id="chart" width="30" height="30" role="img"><title>Sales chart</title><rect width="30" height="30" fill="green"/></svg>
  <button type="button" aria-label="Switch to dark mode"><svg class="icon" width="20" height="20" aria-hidden="true"><circle cx="10" cy="10" r="8"/></svg></button>
  <span class="badge" aria-hidden="true"><img src="red.png" alt="" width="20" height="20"></span>
  <img class="flourish" src="blue.png" role="presentation" width="20" height="20">
  <img src="red.png" alt="hidden" style="display:none">
</main>
</body>
</html>
