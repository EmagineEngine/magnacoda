# On a version tag (v0.1.0, v0.2.0rc1): build the package, check the wheel, then publish to PyPI once
# you approve it. Publishing uses PyPI's trusted publishing, so no token is stored anywhere. Set up
# once: a trusted publisher on PyPI (owner emagineengine, repository magnacoda, workflow release.yml,
# environment pypi), and the pypi environment here with you as its required reviewer.

name: Release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # the version comes from git tags, so fetch the full history
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: python -m build
      - run: python scripts/check_wheel.py dist/*.whl
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/magnacoda/
    permissions:
      id-token: write  # for trusted publishing
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
